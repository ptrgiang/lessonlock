[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lessonlock"
version = "0.1.0"
description = "Turn coding-agent corrections into deterministic guardrails. Correct it once. Block it forever."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "lessonlock contributors"}]
dependencies = ["PyYAML>=6.0.1"]
keywords = ["ai", "coding-agent", "claude-code", "codex", "openai-codex", "guardrails", "hooks", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2"]

[project.scripts]
lessonlock = "lessonlock.cli:main"

[project.urls]
Repository = "https://github.com/ptrgiang/lessonlock"
Issues = "https://github.com/ptrgiang/lessonlock/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["lessonlock"]
